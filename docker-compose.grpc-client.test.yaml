services:
  equipos-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  equipos-api:
    build:
      context: ./Equipos
      dockerfile: Dockerfile
      target: base
    env_file:
      - .env  # Inyecta toda la configuración de base de datos automáticamente
    environment:
      # Dejamos estos dos explícitos aquí por si son específicos de este entorno
      # o puedes moverlos a tu .env y borrar este bloque 'environment'
      GRPC_HOST: "[::]"
      GRPC_PORT: 50051
    depends_on:
      equipos-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/grpc_health_probe", "-addr=:50051"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  cliente-node-tests:
    build:
      context: .
      dockerfile: cliente-node/Dockerfile
      additional_contexts:
        equipos: ./Equipos  # Para poder acceder a equipos.proto
    env_file:
      - .env  # Inyecta EQUIPOS_GRPC_URL automáticamente
    environment:
      # Tu .env tiene GRPC_TIMEOUT_SECONDS, pero Node parece usar MS.
      # Lo dejamos explícito aquí para que no se rompa tu app de Node.
      GRPC_TIMEOUT_MS: 5000
    depends_on:
      equipos-api:
        condition: service_healthy