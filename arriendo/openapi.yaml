openapi: 3.0.3

info:
  title: API ArriendaPro
  description: API REST para la gestión de arriendos y clientes.
  version: 1.0.0

security:
  - BearerAuth: []

paths:
  /v1/clients:
    post:
      summary: Crear un nuevo cliente
      description: Registra un nuevo cliente en el sistema de arriendos.
      operationId: createClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRequest'
      responses:
        '201':
          description: Cliente creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '400':
          description: Datos de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotAuthorizedError'
        '403':
          description: Permisos insuficientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'

    get:
      summary: Listar clientes
      description: Retorna la lista de clientes registrados. Si no existen registros, retorna una lista vacía.
      operationId: getAllClients
      parameters:
        - name: limit
          in: query
          description: Límite de registros a retornar
          required: false
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          description: Desplazamiento para paginación
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Lista de clientes (puede ser vacía)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotAuthorizedError'
        '403':
          description: Permisos insuficientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'

  /v1/clients/{clientId}:
    get:
      summary: Obtener datos de un cliente
      description: Retorna la información de un cliente específico mediante su ID.
      operationId: getClientById
      parameters:
        - name: clientId
          in: path
          description: ID del cliente
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Datos obtenidos correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotAuthorizedError'
        '403':
          description: Permisos insuficientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Cliente no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'

  /v1/rentals:
    post:
      summary: Crear un nuevo arriendo
      description: Registra un nuevo arriendo verificando stock y reservando vía gRPC en Equipos.
      operationId: createRental
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RentalRequest'
      responses:
        '201':
          description: Arriendo creado y unidad reservada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalResponse'
        '400':
          description: Solicitud incorrecta o fechas no válidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotAuthorizedError'
        '403':
          description: Permisos insuficientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Cliente o equipo inexistente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '409':
          description: Conflicto por falta de unidades disponibles en el inventario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '503':
          description: Servicio de Equipos (gRPC) no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
        '504':
          description: Timeout al comunicar con el servicio gRPC
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayTimeoutError'

    get:
      summary: Listar arriendos
      description: Retorna la lista de arriendos registrados. Si no existen registros, retorna una lista vacía.
      operationId: getAllRentals
      parameters:
        - name: limit
          in: query
          description: Límite de registros a retornar
          required: false
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          description: Desplazamiento para paginación
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Lista de arriendos (puede ser vacía)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RentalResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotAuthorizedError'
        '403':
          description: Permisos insuficientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'

  /v1/rentals/{rentalId}:
    get:
      summary: Obtener datos de un arriendo
      description: Retorna los datos de un arriendo específico mediante su ID.
      operationId: getRentalById
      parameters:
        - name: rentalId
          in: path
          description: ID del arriendo
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Datos obtenidos correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotAuthorizedError'
        '403':
          description: Permisos insuficientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Arriendo no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'

  /v1/rentals/{rentalId}/return:
    post:
      summary: Retornar un arriendo
      description: Finaliza el arriendo y libera la unidad en Equipos vía gRPC.
      operationId: returnRental
      parameters:
        - name: rentalId
          in: path
          description: ID del arriendo a retornar
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Arriendo retornado y unidad liberada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotAuthorizedError'
        '403':
          description: Permisos insuficientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Arriendo no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '409':
          description: Transición inválida (ej. el arriendo ya estaba finalizado o cancelado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '503':
          description: Servicio de Equipos (gRPC) no disponible al intentar liberar unidad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
        '504':
          description: Timeout al comunicar con el servicio gRPC
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayTimeoutError'

  /v1/rentals/{rentalId}/cancel:
    post:
      summary: Cancelar un arriendo
      description: Cancela un arriendo activo y revierte la reserva de unidad en Equipos vía gRPC.
      operationId: cancelRental
      parameters:
        - name: rentalId
          in: path
          description: ID del arriendo a cancelar
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Arriendo cancelado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotAuthorizedError'
        '403':
          description: Permisos insuficientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Arriendo no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '409':
          description: Transición inválida (ej. arriendo ya completado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '503':
          description: Servicio de Equipos (gRPC) no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceUnavailableError'
        '504':
          description: Timeout al comunicar con el servicio gRPC
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayTimeoutError'

components:
  schemas:
    ClientRequest:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          description: Nombre del cliente
          example: "Ana Pérez"
        email:
          type: string
          format: email
          description: Correo electrónico del cliente
          example: "ana@example.com"

    RentalHistory:
      type: object
      required:
        - active
        - completed
      properties:
        active:
          type: array
          description: Lista de IDs de arriendos activos
          items:
            type: integer
          example: [1, 3]
        completed:
          type: array
          description: Lista de IDs de arriendos finalizados
          items:
            type: integer
          example: [2]

    ClientResponse:
      type: object
      required:
        - id
        - name
        - email
        - createdAt
        - rentalHistory
      properties:
        id:
          type: integer
          description: ID del cliente
          example: 101
        name:
          type: string
          description: Nombre del cliente
          example: "Ana Pérez"
        email:
          type: string
          format: email
          description: Correo electrónico del cliente
          example: "ana@example.com"
        createdAt:
          type: string
          format: date-time
          description: Fecha de creación del cliente
          example: "2026-09-16T22:00:00Z"
        rentalHistory:
          $ref: '#/components/schemas/RentalHistory'

    RentalRequest:
      type: object
      required:
        - clientId
        - equipmentId
        - startDate
        - endDate
      properties:
        clientId: 
          type: integer
          description: ID del cliente que realiza el arriendo
          example: 101
        equipmentId:
          type: integer
          description: ID del equipo a arrendar
          example: 50
        startDate:
          type: string
          format: date-time
          description: Fecha de inicio del arriendo
          example: "2026-09-20T10:00:00Z"
        endDate:
          type: string
          format: date-time
          description: Fecha estimada de finalización
          example: "2026-09-25T18:00:00Z"

    RentalResponse:
      type: object
      required:
        - id
        - clientId
        - equipmentId
        - startDate
        - endDate
        - status
      properties:
        id:
          type: integer
          description: ID del arriendo
          example: 1
        clientId:
          type: integer
          description: ID del cliente
          example: 101
        equipmentId:
          type: integer
          description: ID del equipo arrendado
          example: 50
        startDate:
          type: string
          format: date-time
          description: Fecha de inicio del arriendo
          example: "2026-09-20T10:00:00Z"
        endDate:
          type: string
          format: date-time
          description: Fecha de finalización
          example: "2026-09-25T18:00:00Z"
        status:
          type: string
          description: Estado del arriendo
          enum: [ACTIVE, COMPLETED, CANCELLED]
          example: "ACTIVE"

    BadRequestError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "BAD_REQUEST"
        message:
          type: string
          example: "El cuerpo de la solicitud no cumple con las validaciones requeridas."

    NotAuthorizedError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "UNAUTHORIZED"
        message:
          type: string
          example: "Token de autenticación faltante, inválido o expirado."

    ForbiddenError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "FORBIDDEN"
        message:
          type: string
          example: "El usuario autenticado no posee los permisos necesarios para realizar esta acción."

    NotFoundError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "RESOURCE_NOT_FOUND"
        message:
          type: string
          example: "El recurso solicitado no existe en el sistema."

    ConflictError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "INSUFFICIENT_STOCK"
        message:
          type: string
          example: "No hay unidades disponibles para el equipo seleccionado o transición de estado inválida."

    ServiceUnavailableError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "EQUIPMENTS_SERVICE_UNAVAILABLE"
        message:
          type: string
          example: "El servicio gRPC de Equipos no se encuentra disponible momentáneamente."

    GatewayTimeoutError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "EQUIPMENTS_SERVICE_TIMEOUT"
        message:
          type: string
          example: "Tiempo de espera agotado al conectar con el servicio gRPC de Equipos."

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT