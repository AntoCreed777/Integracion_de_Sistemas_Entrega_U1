name: arriendo-concurrent-integration

services:
  equipos-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30

  equipos-api:
    build:
      context: ./Equipos
      target: base
    env_file:
      - .env  # Inyecta DATABASE_HOST, DB_USER, DB_PASSWORD, GRPC_PORT, etc. automáticamente
    depends_on:
      equipos-db:
        condition: service_healthy

  arriendo-db:
    image: postgres:16-alpine
    environment:
      # Añadimos _test al nombre base (quedará arriendo_db_test)
      POSTGRES_DB: ${ARRIENDO_DB_NAME}_test
      POSTGRES_USER: ${ARRIENDO_DB_USER}
      POSTGRES_PASSWORD: ${ARRIENDO_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ARRIENDO_DB_USER} -d ${ARRIENDO_DB_NAME}_test"]
      interval: 2s
      timeout: 2s
      retries: 30

  arriendo-api:
    build:
      context: ./arriendo
      target: base
      additional_contexts:
        equipos: ./Equipos
    env_file:
      - .env  # Inyecta API Keys, Redis, GRPC URL, etc.
    environment:
      # Construimos la URL usando las variables del .env apuntando al contenedor 'arriendo-db'
      DATABASE_URL: postgresql+psycopg2://${ARRIENDO_DB_USER}:${ARRIENDO_DB_PASSWORD}@arriendo-db:5432/${ARRIENDO_DB_NAME}_test
    depends_on:
      arriendo-db:
        condition: service_healthy
      equipos-api:
        condition: service_healthy

  arriendo-unit-db:
    image: postgres:16-alpine
    environment:
      # Añadimos _unit_test al nombre base (quedará arriendo_db_unit_test)
      POSTGRES_DB: ${ARRIENDO_DB_NAME}_unit_test
      POSTGRES_USER: ${ARRIENDO_DB_USER}
      POSTGRES_PASSWORD: ${ARRIENDO_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ARRIENDO_DB_USER} -d ${ARRIENDO_DB_NAME}_unit_test"]
      interval: 2s
      timeout: 2s
      retries: 30

  integration-tests:
    build:
      context: ./arriendo
      target: test
      additional_contexts:
        equipos: ./Equipos
    env_file:
      - .env  # Inyecta API Keys, Redis falso, GRPC URL, etc.
    environment:
      # Construimos la URL apuntando al contenedor unitario 'arriendo-unit-db'
      DATABASE_URL: postgresql+psycopg2://${ARRIENDO_DB_USER}:${ARRIENDO_DB_PASSWORD}@arriendo-unit-db:5432/${ARRIENDO_DB_NAME}_unit_test
      API_BASE_URL: http://arriendo-api:${ARRIENDOS_API_PORT}
      REAL_GRPC_TEST: "1"
    command: ["pytest", "-q"]
    depends_on:
      arriendo-api:
        condition: service_healthy
      arriendo-unit-db:
        condition: service_healthy