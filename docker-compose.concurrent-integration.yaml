name: arriendo-concurrent-integration

services:
  equipos-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: equipos_db
      POSTGRES_USER: equipos_user
      POSTGRES_PASSWORD: equipos_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equipos_user -d equipos_db"]
      interval: 2s
      timeout: 2s
      retries: 30

  equipos-api:
    build:
      context: ./Equipos
      target: base
    environment:
      DATABASE_HOST: equipos-db
      DATABASE_PORT: "5432"
      DATABASE_NAME: equipos_db
      DATABASE_USER: equipos_user
      DATABASE_PASSWORD: equipos_password
    depends_on:
      equipos-db:
        condition: service_healthy

  arriendo-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arriendo_test_db
      POSTGRES_USER: arriendos_test_user
      POSTGRES_PASSWORD: arriendos_test_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arriendos_test_user -d arriendo_test_db"]
      interval: 2s
      timeout: 2s
      retries: 30

  arriendo-api:
    build:
      context: ./arriendo
      target: base
      additional_contexts:
        equipos: ./Equipos
    environment:
      DATABASE_URL: postgresql+psycopg2://arriendos_test_user:arriendos_test_password@arriendo-db:5432/arriendo_test_db
      EQUIPOS_GRPC_URL: equipos-api:50051
      ACTIVATE_REDIS: "false"
      ADMIN_API_KEY: apikey_admin
      CLIENT_API_KEY: apikey_cliente
    depends_on:
      arriendo-db:
        condition: service_healthy
      equipos-api:
        condition: service_healthy

  arriendo-unit-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arriendo_unit_test_db
      POSTGRES_USER: arriendos_test_user
      POSTGRES_PASSWORD: arriendos_test_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arriendos_test_user -d arriendo_unit_test_db"]
      interval: 2s
      timeout: 2s
      retries: 30

  integration-tests:
    build:
      context: ./arriendo
      target: test
      additional_contexts:
        equipos: ./Equipos
    environment:
      DATABASE_URL: postgresql+psycopg2://arriendos_test_user:arriendos_test_password@arriendo-unit-db:5432/arriendo_unit_test_db
      EQUIPOS_GRPC_URL: equipos-api:50051
      API_BASE_URL: http://arriendo-api:8080
      REAL_GRPC_TEST: "1"
      ACTIVATE_REDIS: "false"
      ADMIN_API_KEY: apikey_admin
      CLIENT_API_KEY: apikey_cliente
    command: ["pytest", "-q"]
    depends_on:
      arriendo-api:
        condition: service_healthy
      arriendo-unit-db:
        condition: service_healthy
